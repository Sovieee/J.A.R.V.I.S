<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>J.A.R.V.I.S</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    body {
      background: #020617;
      color: #00f7ff;
      font-family: monospace;
    }

    .glow {
      text-shadow: 0 0 10px #00f7ff;
    }

    .panel {
      border: 1px solid rgba(0,255,255,0.2);
      background: rgba(0, 10, 20, 0.6);
      backdrop-filter: blur(8px);
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background: #00f7ff;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.8); opacity: 0.3; }
      100% { transform: scale(1); opacity: 1; }
    }

    #ai-text::-webkit-scrollbar {
      width: 4px;
    }

    #ai-text::-webkit-scrollbar-thumb {
      background: #00f7ff;
    }
  </style>
</head>

<body class="h-screen overflow-hidden">

  <div class="grid grid-cols-12 grid-rows-6 gap-2 p-2 h-full">

    <!-- LEFT: SYSTEM LOGS -->
    <div class="col-span-3 row-span-6 panel p-3 overflow-y-auto" id="logs">
      <h2 class="glow mb-2">SYSTEM LOGS</h2>
    </div>

    <!-- RIGHT SIDE CONTAINER -->
<div class="col-span-3 row-span-6 flex flex-col gap-2">

  <!-- GLOBAL DATA -->
  <div class="panel p-3 flex-1">
    <h2 class="glow mb-2">GLOBAL DATA</h2>
    <div id="map" class="h-full w-full rounded"></div>
  </div>

  <div id="camera-container" class="hidden flex flex-col items-center mt-2">
  <video id="camera" autoplay playsinline class="w-full rounded"></video>
  <div class="flex gap-2 mt-2">
    <button id="capture-btn">📸 Capture</button>
    <button id="record-btn">🎥 Record</button>
    <button id="stop-btn">⏹ Stop</button>
  </div>
</div>

  <!-- LIVE FEED -->
  <div class="panel p-3 flex-1 overflow-hidden">
    <h2 class="glow mb-2">LIVE FEED</h2>
    <div id="live-feed" class="text-xs opacity-70 h-full overflow-y-auto"></div>
  </div>

  <!-- WEATHER -->
<div class="panel p-3 flex-1">
    <h2 class="glow mb-2">WEATHER</h2>
    <div id="weather-icon" class="text-4xl mb-2 glow"></div>

    <div id="weather-box" class="flex flex-col justify-center items-center h-full text-center">

  <div id="weather-city" class="text-lg glow">Detecting...</div>

  <div id="weather-temp" class="text-3xl mt-2">--°C</div>

  <div id="weather-desc" class="text-xs opacity-70 mt-1">--</div>

</div>

  </div>

</div>

    <!-- CENTER: AI CORE -->
    <div class="col-span-6 row-span-4 panel flex flex-col items-center justify-center text-center p-4 overflow-hidden">

      <div class="pulse-dot mb-4"></div>

      <h1 class="text-2xl glow">J.A.R.V.I.S</h1>

      <div 
        id="ai-text"
        class="mt-4 text-sm w-full max-h-40 overflow-y-auto whitespace-pre-wrap break-words text-left px-2"
      >
        Awaiting your command...
      </div>

      <input 
        id="command-input"
        class="mt-6 bg-transparent border border-cyan-400 text-center p-2 outline-none w-2/3"
        placeholder="Enter command..."
      />

    </div>

    <!-- BOTTOM: GRAPH + STATUS -->
    <div class="col-span-6 row-span-2 panel p-3 flex flex-col">

      <canvas id="chart" style="max-height: 200px;"></canvas>

      <div class="flex justify-between text-sm mt-2">
        <div>CPU: <span id="cpu">12%</span></div>
        <div>RAM: <span id="ram">34%</span></div>
        <div>NETWORK: <span id="net">ACTIVE</span></div>
        <div>STATUS: <span class="text-green-400">ONLINE</span></div>
      </div>

    </div>

  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="renderer.js"></script>

</body>
</html>
